name: Build and test
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Collect exact packaged artifact
        if: matrix.java == '21'
        run: |
          version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          mkdir -p artifact
          cp "target/PluginUpdateWatch-$version.jar" artifact/
          printf '%s\n' "$version" > artifact/version.txt
          cd artifact
          sha256sum "PluginUpdateWatch-$version.jar" > "PluginUpdateWatch-$version.jar.sha256"
      - uses: actions/upload-artifact@v4
        if: matrix.java == '21'
        with:
          name: plugin-java-21
          path: artifact/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-java-${{ matrix.java }}
          path: target/surefire-reports/
          if-no-files-found: warn
