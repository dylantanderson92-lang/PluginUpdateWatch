name: Publish verified release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build.yml
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plugin-java-21
          path: release
      - name: Verify artifact and tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          version="$(cat version.txt)"
          test "$RELEASE_TAG" = "v$version"
          sha256sum --check "PluginUpdateWatch-$version.jar.sha256"
          unzip -p "PluginUpdateWatch-$version.jar" plugin.yml | grep -Fx "version: $version"
      - name: Publish exact verified artifact with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(cat release/version.txt)"
          gh release create "$RELEASE_TAG" \
            "release/PluginUpdateWatch-$version.jar" \
            "release/PluginUpdateWatch-$version.jar.sha256" \
            --verify-tag --generate-notes --title "PluginUpdateWatch $version"
