name: Publish verified release
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['.github/release-version']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build.yml
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plugin-java-21
          path: release
      - name: Verify artifact and tag
        id: artifact
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(cat .github/release-version)"
          fi
          cd release
          version="$(cat version.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$tag" = "v$version"
          sha256sum --check "PluginUpdateWatch-$version.jar.sha256"
          unzip -p "PluginUpdateWatch-$version.jar" plugin.yml | grep -Fx "version: $version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Tag verified release commit
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.artifact.outputs.tag }}
        run: |
          if existing="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null)"; then
            test "$existing" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"
          fi
      - name: Publish exact verified artifact with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.artifact.outputs.tag }}
        run: |
          version="$(cat release/version.txt)"
          sed '/^---$/,$d' RELEASE-NOTES.md > release/notes.md
          gh release create "$RELEASE_TAG" \
            "release/PluginUpdateWatch-$version.jar" \
            "release/PluginUpdateWatch-$version.jar.sha256" \
            --verify-tag --generate-notes --notes-file release/notes.md \
            --title "PluginUpdateWatch $version"
