# Scan installed plugins at startup. Fill in blank source links after detection.
check-interval-minutes: 360
notify-on-join: true
# Empty uses the parent of this plugin's data folder. Relative paths use the server working directory.
plugins-directory: ""
debug: false
network:
  connect-timeout-seconds: 10
  read-timeout-seconds: 15
  metadata-timeout-seconds: 30
  attempts: 3
downloads:
  max-size-mib: 100
  timeout-seconds: 120
  # True blocks providers/assets with no supported checksum (including most Spigot files).
  require-checksum: false
# Manual entries need only the exact JAR filename and source link.
updates: []
# updates:
#   - jar: "ExamplePlugin-2.0.jar"
#     source: "https://modrinth.com/plugin/example-plugin"
#   - jar: "AnotherPlugin.jar"
#     source: "https://www.spigotmc.org/resources/another-plugin.12345/"
#   - jar: "GitHubPlugin.jar"
#     source: "https://github.com/owner/repository"
# Existing 1.0/1.1 plugins entries are supported and not overwritten.
plugins: {}
